# Battle look (Play America 250): how each battle level is lit at each time of day, the rendering
# tiers, and which tier each platform runs. File: unreal/PA250Sim/data/battle_look.json, read by the
# Unreal battle only (Battle/PA250BattleLook). Display only: nothing here reaches the campaign.
# Every number is GAMEPLAY TUNING (GAME INVENTION). The battle's hour comes from the setup
# (battle_setup.yaml hour_of_day); the band is looked up here (shared vectors
# protocol/test_vectors/anim/time_band_*). A platform whose `measured` is null has not been
# measured and runs the lowest tier until it is.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "battle_look.v1"
title: BattleLookFile
type: object
additionalProperties: false
required: [note, frame_rate_bar, time_bands, default_band, levels, tiers, chosen, soldier_lod]
definitions:
  rgb: {type: array, minItems: 3, maxItems: 3, items: {type: number, minimum: 0}}
  hours:
    type: array
    minItems: 1
    description: "Hour ranges [first, last], both ends in the band, hours 0 to 23."
    items: {type: array, minItems: 2, maxItems: 2, items: {type: integer, minimum: 0, maximum: 23}}
  level:
    type: object
    additionalProperties: false
    required: [dawn, day, dusk]
    properties:
      dawn: {$ref: "#/definitions/look"}
      day: {$ref: "#/definitions/look"}
      dusk: {$ref: "#/definitions/look"}
  choice:
    type: object
    additionalProperties: false
    required: [tier, measured]
    properties:
      tier: {type: string, pattern: "^[a-z0-9_]+$"}
      measured:
        description: "The day it was measured on that platform (YYYY-MM-DD), or null: not measured, so the lowest tier."
        oneOf: [{type: "null"}, {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}]
      note: {type: string}
  look:
    type: object
    additionalProperties: false
    required: [sun_rot, sun_lux, sun_color, sky_intensity, fog_density, fog_height_falloff, volumetric_fog, exposure_ev, white_temp, gain, bloom, vignette]
    properties:
      note: {type: string}
      sun_rot: {type: array, minItems: 3, maxItems: 3, items: {type: number}, description: "The sun's rotation: pitch (negative: above the horizon), yaw, roll."}
      sun_lux: {type: number, minimum: 0}
      sun_color: {$ref: "#/definitions/rgb", description: "0 to 255."}
      sky_intensity: {type: number, minimum: 0}
      fog_density: {type: number, minimum: 0}
      fog_height_falloff: {type: number, minimum: 0}
      volumetric_fog: {type: boolean}
      exposure_ev: {type: number, description: "Manual exposure bias."}
      white_temp: {type: number, minimum: 1500, maximum: 15000}
      gain: {$ref: "#/definitions/rgb", description: "Colour gain (the camera's white balance for that light)."}
      bloom: {type: number, minimum: 0}
      vignette: {type: number, minimum: 0}
properties:
  note: {type: string}
  frame_rate_bar: {type: number, exclusiveMinimum: 0, description: "A tier is chosen for a platform only if it holds this many frames a second on every level in every band."}
  time_bands:
    type: object
    additionalProperties: false
    required: [dawn, day, dusk]
    description: "Together the three cover every hour from 0 to 23 exactly once."
    properties:
      dawn: {$ref: "#/definitions/hours"}
      day: {$ref: "#/definitions/hours"}
      dusk: {$ref: "#/definitions/hours"}
  default_band: {enum: [dawn, day, dusk], description: "The band of a battle whose setup does not say the hour (hour_of_day -1)."}
  levels:
    type: object
    additionalProperties: false
    required: [L_Lexington, L_Concord, L_Harbor]
    properties:
      L_Lexington: {$ref: "#/definitions/level"}
      L_Concord: {$ref: "#/definitions/level"}
      L_Harbor: {$ref: "#/definitions/level"}
  tiers:
    type: array
    minItems: 1
    description: "Lowest first. cvars are engine console variables set when the battle begins."
    items:
      type: object
      additionalProperties: false
      required: [name, note, cvars]
      properties:
        name: {type: string, pattern: "^[a-z0-9_]+$"}
        note: {type: string}
        cvars: {type: object, additionalProperties: {type: number}}
  chosen:
    type: object
    additionalProperties: false
    required: [win64, mac]
    properties:
      win64: {$ref: "#/definitions/choice"}
      mac: {$ref: "#/definitions/choice"}
  soldier_lod:
    type: object
    additionalProperties: false
    required: [shadow_cast_m, update_rate_optimisation]
    properties:
      note: {type: string}
      shadow_cast_m: {type: number, minimum: 0, description: "A soldier farther than this from the viewer casts no shadow. 0: every soldier casts one."}
      update_rate_optimisation: {type: boolean, description: "Distant and off-screen soldiers are animated at a lower rate (the engine's update-rate optimisation)."}
