# Battle feel (Play America 250): how the battle moves, answers the hand and looks alive.
# File: unreal/PA250Sim/data/battle_feel.json, read by the Unreal battle only (Battle/PA250BattleFeel).
# Display and handling only: nothing here reaches the campaign, and the sim core does not read it.
# Every number is GAMEPLAY TUNING (GAME INVENTION). Sections are added milestone by milestone.
# Budgets that depend on the machine are keyed by platform (win64, mac): a platform with
# `measured: null` has not been measured and holds the lowest setting until it is.
# Shared vectors: protocol/test_vectors/anim (pytest and the Unreal PA250Combat cases).
$schema: "http://json-schema.org/draft-07/schema#"
$id: "battle_feel.v1"
title: BattleFeelFile
type: object
additionalProperties: false
required: [note, animation, carry, kneel, reload, traversal, movement, spyglass, input, intensity, musket, verify]
properties:
  note: {type: string, minLength: 1}
  animation:
    type: object
    additionalProperties: false
    required: [motion_matching, platforms, switch_hysteresis_m, tier_blend_seconds, cheap_crossfade_seconds, stop_settle_seconds,
               mm_blend_seconds, bot_search_throttle_seconds, play_rate_min, play_rate_max, upper_body_sway,
               gait_speed_cm_s]
    description: >-
      Two ways a soldier's body is animated. full: motion matching over the retargeted locomotion
      clips (starts, stops, pivots, turns). cheap: one looping clip chosen by speed, cross-faded.
      The player is always full. Then the soldiers nearest the player, inside switch_distance_m, are
      full until full_quality_max soldiers are (the player counts as one). A soldier already full
      stays full out to switch_distance_m + switch_hysteresis_m, so the edge does not flicker.
    properties:
      motion_matching:
        type: boolean
        description: "false: everyone uses the cheap path whatever the budgets say (the state until M1 verifies, and the fallback)."
      platforms:
        type: object
        additionalProperties: false
        required: [win64, mac]
        properties:
          win64: {$ref: "#/definitions/animation_budget"}
          mac: {$ref: "#/definitions/animation_budget"}
      switch_hysteresis_m: {type: number, minimum: 0}
      tier_blend_seconds: {type: number, minimum: 0, description: "Blend when a soldier changes between full and cheap."}
      cheap_crossfade_seconds: {type: number, minimum: 0, description: "Cross-fade between the cheap path's clips (it was a hard cut)."}
      stop_settle_seconds: {type: number, minimum: 0, description: "A man who has just halted keeps his last gait's stop clips to search for this long, so the stop plays out; after it only the standing clips are searched and any moving clip is left."}
      mm_blend_seconds: {type: number, minimum: 0, description: "Blend into a newly matched pose."}
      bot_search_throttle_seconds: {type: number, minimum: 0, description: "A bot searches for a new pose no oftener than this; the player searches every frame."}
      play_rate_min: {type: number, exclusiveMinimum: 0}
      play_rate_max: {type: number, exclusiveMinimum: 0}
      upper_body_sway: {type: number, minimum: 0, maximum: 1, description: "Share of the matched pose's arm swing kept while both hands hold the musket."}
      gait_speed_cm_s:
        type: object
        additionalProperties: false
        required: [idle_max, walk_max, run_max]
        description: "Speed bands that choose the clip set: at or under idle_max idle, to walk_max walk, to run_max run, above it sprint."
        properties:
          idle_max: {type: number, minimum: 0}
          walk_max: {type: number, minimum: 0}
          run_max: {type: number, minimum: 0}
  carry:
    type: object
    additionalProperties: false
    required: [blend_seconds, shoulder_at_walk, clear, trail, shoulder, charge]
    description: >-
      How the musket is carried while moving, layered on the upper body with both hands on it.
      trail: at the trail, in the right hand before the right hip, muzzle up and across to the left
      (the carry the game had before the task of 2026-11-15, unchanged). shoulder: shouldered arms,
      the piece sloped up at the right side (a bot WALKING with no enemy in view; never at a run). charge: charge
      bayonet, levelled at the hip (a man charging). Angles are added to the musket's aim; hand_* is
      where the right hand holds it, in cm from the chest (forward, right, up; up is negative below it).
    properties:
      blend_seconds: {type: number, minimum: 0}
      shoulder_at_walk:
        type: boolean
        description: >-
          true: a bot walking with no enemy in view shoulders his piece. false (2026-11-15): he keeps
          it at the trail. The shoulder pose here was judged from the front and looked wrong (the piece
          clutched upright to the chest), so it is off until a pose is made for it.
      clear:
        type: object
        additionalProperties: false
        required: [distance_cm, half_width_cm, pitch_deg, yaw_deg, check_seconds]
        description: >-
          A man at the trail whose muzzle would be in a friend raises it (a squad at its leader's
          shoulders stood with trailed muskets through the man ahead: user report 2026-11-15).
        properties:
          note: {type: string}
          distance_cm: {type: number, minimum: 0}
          half_width_cm: {type: number, minimum: 0}
          pitch_deg: {type: number, minimum: 0, maximum: 90}
          yaw_deg: {type: number, minimum: -180, maximum: 180}
          check_seconds: {type: number, exclusiveMinimum: 0}
      trail: {$ref: "#/definitions/carry_pose"}
      shoulder: {$ref: "#/definitions/carry_pose"}
      charge: {$ref: "#/definitions/carry_pose"}
  kneel:
    type: object
    additionalProperties: false
    required: [drop_cm, rear_foot_back_cm, lean_deg, blend_seconds]
    description: >-
      A man who is ducked (down behind a wall or a work while he loads, or ducked by the player)
      kneels, so that he is in fact hidden: hips lowered by drop_cm with the feet kept on the ground,
      the right foot drawn back rear_foot_back_cm, the body leant forward lean_deg. Until 2026-11-15
      ducking only shrank his collision and he stood as tall as ever. Procedural; a clip may replace it.
    properties:
      note: {type: string}
      drop_cm: {type: number, minimum: 0, maximum: 70}
      rear_foot_back_cm: {type: number, minimum: 0, maximum: 80}
      lean_deg: {type: number, minimum: -30, maximum: 45}
      blend_seconds: {type: number, minimum: 0}
  reload:
    type: object
    additionalProperties: false
    required: [ram_left_hand_height_cm, ram_left_hand_max_slide_cm]
    description: >-
      The loading drill's left hand while the musket stands on its butt to be rammed: it holds the
      barrel at ram_left_hand_height_cm above the man's feet (slid up from the musket's own
      left-hand spot toward the muzzle, by at most ram_left_hand_max_slide_cm), where a standing man
      can reach it.
    properties:
      note: {type: string}
      ram_left_hand_height_cm: {type: number, minimum: 40, maximum: 160}
      ram_left_hand_max_slide_cm: {type: number, minimum: 0, maximum: 130}
  traversal:
    type: object
    additionalProperties: false
    required: [min_speed_cm_s, detect_distance_cm, max_approach_angle_deg, landing_clear_cm, start_lead_seconds, check_hz, hurdle_min_cm, hurdle_max_height_cm, vault_max_height_cm,
               vault_max_depth_cm, mantle_max_height_cm, mantle_max_depth_cm, capsule_half_height_cm, cooldown_seconds,
               bot_link_spacing_m, bot_link_cost, bot_stagger_seconds, formation_error_max_cm]
    description: >-
      Automatic traversal. The rule (shared vectors protocol/test_vectors/anim/traversal_classify_*):
      height under hurdle_min_cm: nothing (he steps over). Height above mantle_max_height_cm, or depth
      above mantle_max_depth_cm: none, it stays cover. Otherwise, depth up to vault_max_depth_cm and
      height up to vault_max_height_cm: a hurdle when the height is at most hurdle_max_height_cm, else a
      vault. Everything else that is left: a mantle. Height is from the ground the man stands on; depth
      is through the obstacle along his run.
    properties:
      note: {type: string}
      min_speed_cm_s: {type: number, minimum: 0, description: "Only a man moving at least this fast (a sprint) traverses by himself."}
      detect_distance_cm: {type: number, minimum: 0, description: "How far ahead of him the obstacle is looked for."}
      check_hz: {type: number, exclusiveMinimum: 0}
      hurdle_min_cm: {type: number, minimum: 0}
      hurdle_max_height_cm: {type: number, minimum: 0}
      vault_max_height_cm: {type: number, minimum: 0}
      vault_max_depth_cm: {type: number, minimum: 0}
      mantle_max_height_cm: {type: number, minimum: 0}
      mantle_max_depth_cm: {type: number, minimum: 0}
      capsule_half_height_cm: {type: number, exclusiveMinimum: 0, description: "Half the height of the room there must be over the top: a man folded this small is swept across it, and anything in his way refuses the crossing."}
      max_approach_angle_deg: {type: number, minimum: 0, maximum: 89, description: "He must be running within this angle of square to the obstacle."}
      landing_clear_cm: {type: number, minimum: 0, description: "How far beyond the far face the ground is looked for, and the least distance beyond it that he lands."}
      start_lead_seconds: {type: number, minimum: 0, description: "The clip is entered where its run-up is as long as his distance from the obstacle, but never later than this long before its first warp window ends."}
      cooldown_seconds: {type: number, minimum: 0}
      bot_link_spacing_m: {type: number, exclusiveMinimum: 0}
      bot_link_cost: {type: number, minimum: 0, description: "How much longer than open ground a bot's path counts a crossing."}
      bot_stagger_seconds: {type: number, minimum: 0, description: "Men of one squad start over the same link this far apart."}
      formation_error_max_cm: {type: number, minimum: 0, description: "Pass bar for the wall-crossing matchup: mean distance from formation places after the crossing."}
  movement:
    type: object
    additionalProperties: false
    required: [walk_speed_cm, backstep_speed_cm, sprint_speed_cm, max_acceleration, braking_deceleration, rotation_rate_yaw_deg, camera_lag_speed,
               fire_lock_seconds, mouse_smoothing]
    properties:
      note: {type: string}
      walk_speed_cm: {type: number, exclusiveMinimum: 0}
      backstep_speed_cm: {type: number, exclusiveMinimum: 0, description: "The fastest the player goes backwards while he faces his view (aiming); a bot told to a place behind him turns and goes instead."}
      sprint_speed_cm: {type: number, exclusiveMinimum: 0}
      max_acceleration: {type: number, exclusiveMinimum: 0, description: "cm/s2 on foot."}
      braking_deceleration: {type: number, minimum: 0, description: "cm/s2 when he lets go of the keys."}
      rotation_rate_yaw_deg: {type: number, exclusiveMinimum: 0, description: "How fast a man who turns toward his movement turns (bots, and the player when not facing his view)."}
      camera_lag_speed: {type: number, minimum: 0, description: "The camera arm's lag speed; higher follows tighter, 0 is no lag."}
      fire_lock_seconds: {type: number, minimum: 0, description: "How long a man on foot stands still after his shot."}
      mouse_smoothing: {type: boolean}
  spyglass:
    type: object
    additionalProperties: false
    description: >-
      The gunner's glass: a player serving a gun holds SM_Spyglass in place of his hidden musket; aiming
      raises it (anim_clips gun_crew_observe on the upper body) and, raised, the view is through it.
    required: [fov_narrow_deg, zoom_steps, raise_seconds, clip_eye_seconds, field_fraction, eye_forward_cm]
    properties:
      note: {type: string}
      fov_narrow_deg: {type: number, exclusiveMinimum: 0, maximum: 50, description: "Zoomed all the way in. The glass opens at the man's aim (RFCharacter AimedFOV, 55: a rifleman aiming) and at the aim's look speed, which falls in step with the field of view."}
      zoom_steps: {type: integer, minimum: 1, maximum: 12, description: "Wheel steps from the aim's view to fov_narrow_deg, each the same ratio."}
      raise_seconds: {type: number, exclusiveMinimum: 0, description: "From the aim press to the glass at his eye (and back down)."}
      clip_eye_seconds: {type: number, exclusiveMinimum: 0, description: "The time in gun_crew_observe at which its hands hold the glass at the eye (frame 40 of the clip's constraints at 30 fps)."}
      field_fraction: {type: number, exclusiveMinimum: 0, maximum: 1, description: "The round field's diameter as a share of the screen's height; outside it the screen is dark."}
      eye_forward_cm: {type: number, minimum: 0, maximum: 120, description: "The view through the glass is taken this far ahead of his eye (the tube's length), past his own hands and sleeve."}
  input:
    type: object
    additionalProperties: false
    required: [buffer_seconds]
    description: >-
      The buffer rule (shared vectors protocol/test_vectors/anim/input_buffer_*): a press at time p is
      held; when the action next becomes possible at time r it fires if r - p is at most the action's
      window (a press exactly a window old still fires) and is dropped otherwise. A press is spent
      once; a later press replaces an earlier one.
    properties:
      note: {type: string}
      buffer_seconds:
        type: object
        additionalProperties: false
        required: [fire, reload, vault, order, thrust]
        properties:
          fire: {type: number, minimum: 0}
          reload: {type: number, minimum: 0}
          vault: {type: number, minimum: 0}
          order: {type: number, minimum: 0}
          thrust: {type: number, minimum: 0}
  intensity:
    type: object
    additionalProperties: false
    required: [near_miss, round_shot, shake, shouts, corpses, music, suppression]
    properties:
      note: {type: string}
      near_miss:
        type: object
        additionalProperties: false
        required: [radius_cm, min_shot_distance_cm, fov_punch_deg, flinch, shake_scale, crack_bank]
        description: "A ball that passes within radius_cm of the player's ear, fired from at least min_shot_distance_cm away (never his own)."
        properties:
          radius_cm: {type: number, exclusiveMinimum: 0}
          min_shot_distance_cm: {type: number, minimum: 0}
          fov_punch_deg: {type: number, minimum: 0}
          flinch: {type: number, minimum: 0, maximum: 1, description: "How far his body starts from it (the hit-reaction pose's weight)."}
          shake_scale: {type: number, minimum: 0, description: "Of the camera shake below."}
          crack_bank: {type: string, description: "Sound bank of the crack of a close ball; silent, with a MISSING line, when it is not on disk."}
      round_shot:
        type: object
        additionalProperties: false
        required: [shake_inner_m, shake_outer_m, shake_scale, dirt_radius_m, dirt_seconds]
        description: "Where a cannon ball strikes: the camera shakes in full within shake_inner_m and not at all beyond shake_outer_m; within dirt_radius_m earth is thrown over the view for dirt_seconds."
        properties:
          shake_inner_m: {type: number, minimum: 0}
          shake_outer_m: {type: number, exclusiveMinimum: 0}
          shake_scale: {type: number, minimum: 0}
          dirt_radius_m: {type: number, minimum: 0}
          dirt_seconds: {type: number, minimum: 0}
      shake:
        type: object
        additionalProperties: false
        required: [seconds, location_cm, rotation_deg, frequency_hz]
        description: "The one camera shake (noise), at scale 1."
        properties:
          seconds: {type: number, exclusiveMinimum: 0}
          location_cm: {type: number, minimum: 0}
          rotation_deg: {type: number, minimum: 0}
          frequency_hz: {type: number, exclusiveMinimum: 0}
      shouts:
        type: object
        additionalProperties: false
        required: [charge, rout, officer_down, colours_taken]
        description: "What the men shout at an event, and the least time between two shouts of the same event. key is the voice line (tools/audio/gen_voice_lines.py LINES)."
        properties:
          charge: {$ref: "#/definitions/shout"}
          rout: {$ref: "#/definitions/shout"}
          officer_down: {$ref: "#/definitions/shout"}
          colours_taken: {$ref: "#/definitions/shout"}
      corpses:
        type: object
        additionalProperties: false
        required: [max, seconds, freeze_after_seconds]
        properties:
          max: {type: integer, minimum: 0, description: "Most fallen left on the field; the oldest is cleared first."}
          seconds: {type: number, minimum: 3}
          freeze_after_seconds: {type: number, minimum: 0, description: "A fallen body stops simulating this long after it fell (it lies as it lay)."}
      music:
        type: object
        additionalProperties: false
        required: [layers, fade_seconds, morale_weight, ticket_weight, volume]
        description: "Shared vectors protocol/test_vectors/anim/music_layers_*."
        properties:
          note: {type: string}
          layers:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [bank, from, full]
              properties:
                bank: {type: string}
                from: {type: number, minimum: 0, maximum: 1}
                full: {type: number, minimum: 0, maximum: 1}
          fade_seconds: {type: number, minimum: 0}
          morale_weight: {type: number, minimum: 0, maximum: 1}
          ticket_weight: {type: number, minimum: 0, maximum: 1}
          volume: {type: number, minimum: 0, maximum: 1}
      suppression:
        type: object
        additionalProperties: false
        required: [near_miss_add, impact_add, max, decay_per_second, blur_amount, aim_sway_deg]
        description: >-
          The player's suppression, 0 to max (Battle Feel M3; ARFCharacter::AddSuppression). A near miss
          adds near_miss_add, a strike close by impact_add times how hard it shook him; it falls
          decay_per_second. At level L the view blurs by L x blur_amount and the aim sways L x aim_sway_deg.
        properties:
          note: {type: string}
          near_miss_add: {type: number, minimum: 0, maximum: 1}
          impact_add: {type: number, minimum: 0, maximum: 1}
          max: {type: number, exclusiveMinimum: 0, maximum: 1}
          decay_per_second: {type: number, exclusiveMinimum: 0, description: "Above 0, or a suppressed man never recovers."}
          blur_amount: {type: number, minimum: 0, maximum: 1}
          aim_sway_deg: {type: number, minimum: 0, maximum: 15}
  musket:
    type: object
    additionalProperties: false
    required: [misfire_chance, flash_in_pan_chance, rain_misfire_scale, rain_flash_scale]
    description: >-
      Every trigger pull, the player's too (Battle Feel M4; PA250MusketFeel). flash_in_pan_chance for
      everyone; misfire_chance for a man without a training profile (bots use DA_CombatProfiles).
      Rain (PA250BattleWeather) multiplies both, never below dry.
    properties:
      note: {type: string}
      misfire_chance: {type: number, minimum: 0, maximum: 0.5}
      flash_in_pan_chance: {type: number, minimum: 0, maximum: 0.5}
      rain_misfire_scale: {type: number, minimum: 1}
      rain_flash_scale: {type: number, minimum: 1}
  verify:
    type: object
    additionalProperties: false
    required: [frame_time_margin_pct]
    properties:
      frame_time_margin_pct: {type: number, minimum: 0, description: "A milestone may cost at most this much frame time over the M0 baseline."}
definitions:
  shout:
    type: object
    additionalProperties: false
    required: [key, text, cooldown_seconds]
    properties:
      key: {type: string, pattern: "^[a-z0-9_]+$"}
      text: {type: string, minLength: 2}
      cooldown_seconds: {type: number, minimum: 0}
  animation_budget:
    type: object
    additionalProperties: false
    required: [full_quality_max, switch_distance_m, measured]
    properties:
      full_quality_max: {type: integer, minimum: 1, description: "Soldiers at full quality at once, the player among them. 1 = the player only (the lowest setting)."}
      switch_distance_m: {type: number, minimum: 0}
      measured: {type: ["string", "null"], description: "The date these two were set from a frame-time measurement on this platform (YYYY-MM-DD), or null: not measured, lowest setting."}
  carry_pose:
    type: object
    additionalProperties: false
    required: [pitch_deg, yaw_deg, hand_forward_cm, hand_right_cm, hand_up_cm]
    properties:
      pitch_deg: {type: number, minimum: -90, maximum: 90}
      yaw_deg: {type: number, minimum: -180, maximum: 180}
      hand_forward_cm: {type: number}
      hand_right_cm: {type: number}
      hand_up_cm: {type: number}
