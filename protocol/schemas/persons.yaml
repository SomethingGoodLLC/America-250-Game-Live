# Persons of a campaign (Play America 250): generals, delegates, organizers, envoys and agents.
# File: unreal/PA250Sim/data/persons_boston_1775.json, read by PA250Sim `load_persons`.
# A person holds one role at a time. Roles, traits and abilities are CLOSED sets. Every claim about a
# person is marked `documented` or `invented`; trait assignments and every number are the game's.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "persons.v1"
title: PersonsFile
type: object
additionalProperties: false
required: [rules, abilities, traits, hero, persons]
properties:
  note: {type: string}
  rules:
    type: object
    additionalProperties: false
    required: [detachment_unit_cap, army_unit_cap, muster_buildings, organizer, delegate, envoy, commander, estimates, informer]
    properties:
      detachment_unit_cap: {type: integer, minimum: 1, description: "Most units an army with no general may take in."}
      army_unit_cap: {type: integer, minimum: 1, description: "Most units an army under a general may take in."}
      muster_buildings:
        type: array
        items: {enum: [militia_muster, fort, church]}
        description: "A town with one of these is a town with a muster: an army may be formed there."
      organizer:
        type: object
        additionalProperties: false
        required: [support_per_month, muster_hours_pct]
        properties:
          support_per_month: {type: integer}
          muster_hours_pct: {type: integer, minimum: 1, maximum: 100}
      delegate:
        type: object
        additionalProperties: false
        required: [shift_per_week]
        properties: {shift_per_week: {type: integer}}
      envoy:
        type: object
        additionalProperties: false
        required: [attitude_once]
        properties: {attitude_once: {type: integer}}
      commander:
        type: object
        additionalProperties: false
        required: [aura_radius_m, home_post_radius_m, fall_pressure, fall_pressure_seconds, fall_fate_pct, wounded_days, army_morale_on_fall]
        properties:
          aura_radius_m: {type: number, minimum: 0}
          home_post_radius_m: {type: number, minimum: 0}
          fall_pressure: {type: number, minimum: 0}
          fall_pressure_seconds: {type: number, minimum: 0}
          fall_fate_pct:
            type: object
            additionalProperties: false
            required: [wounded, killed, captured]
            properties:
              wounded: {type: integer, minimum: 0}
              killed: {type: integer, minimum: 0}
              captured: {type: integer, minimum: 0}
          wounded_days: {type: integer, minimum: 1}
          army_morale_on_fall: {type: integer}
      estimates:
        type: object
        additionalProperties: false
        required: [step_men, width_pct]
        properties:
          step_men: {type: integer, minimum: 1, description: "Men counts on the card are rounded to this step."}
          width_pct: {type: integer, minimum: 0, maximum: 90, description: "Half-width of an unscouted range as a percent of the true men count. The range is centred on the truth (never shifted past it); a seed may only widen it."}
      informer:
        type: object
        additionalProperties: false
        required: [exposed_local_support]
        properties: {exposed_local_support: {type: integer}}
  abilities:
    type: object
    additionalProperties: false
    properties:
      alarm: {$ref: "#/definitions/ability"}
      scout: {$ref: "#/definitions/ability"}
      engineer: {$ref: "#/definitions/ability"}
      boats: {$ref: "#/definitions/ability"}
      pen: {$ref: "#/definitions/ability"}
  traits:
    type: object
    additionalProperties: false
    required: [defensive, aggressive, steadfast, adroit, engineer, popular]
    properties:
      defensive: {$ref: "#/definitions/trait"}
      aggressive: {$ref: "#/definitions/trait"}
      steadfast: {$ref: "#/definitions/trait"}
      adroit: {$ref: "#/definitions/trait"}
      engineer: {$ref: "#/definitions/trait"}
      popular: {$ref: "#/definitions/trait"}
  hero:
    type: object
    additionalProperties: false
    required: [basis, note, score, meter, kit, trait_abilities]
    description: >-
      GAME INVENTION (every rule and every number). The hero of a battle is the general who commands
      the player's army. The player earns score in the fight (kills, posts taken, squads rallied) and
      at score.threshold may take control of him where he stands. While he is played a meter drains
      (meter.seconds from full to empty) and the same deeds refill it; at empty the player goes back
      to his file and the general to his own judgement. An army with no general has no hero, and the
      other side's general is never played. If he falls while played, BattleResult.commander_events
      applies as for any general (rules.commander).
    properties:
      basis: {enum: [invented]}
      note: {type: string, minLength: 1}
      score:
        type: object
        additionalProperties: false
        required: [threshold, kill, capture, rally]
        properties:
          threshold: {type: integer, minimum: 1, description: "Score at which the takeover is offered. Spent when it is taken."}
          kill: {type: integer, minimum: 0}
          capture: {type: integer, minimum: 0, description: "A post taken with the player on it."}
          rally: {type: integer, minimum: 0, description: "A withdrawing or routing squad the player brought back."}
      meter:
        type: object
        additionalProperties: false
        required: [seconds, refill_kill_seconds, refill_capture_seconds, refill_rally_seconds]
        properties:
          seconds: {type: number, exclusiveMinimum: 0, description: "A full meter lasts this long with no deeds."}
          refill_kill_seconds: {type: number, minimum: 0}
          refill_capture_seconds: {type: number, minimum: 0}
          refill_rally_seconds: {type: number, minimum: 0}
      kit:
        type: object
        additionalProperties: false
        required: [health_scale, aura_radius_m, rally_radius_m, rally_cooldown_seconds, sword, pistol]
        description: "What every played general has. A person's own `hero` block may change the first three."
        properties:
          health_scale: {type: number, minimum: 1, description: "Times the officer class's health while played."}
          aura_radius_m: {type: number, minimum: 0, description: "His aura while played; larger than rules.commander.aura_radius_m."}
          rally_radius_m: {type: number, minimum: 0, description: "His rally reaches every friendly squad within this, not only the nearest."}
          rally_cooldown_seconds: {type: number, minimum: 0}
          sword:
            type: object
            additionalProperties: false
            required: [damage, reach_cm, recover_seconds]
            properties:
              damage: {type: number, minimum: 0}
              reach_cm: {type: number, minimum: 0}
              recover_seconds: {type: number, minimum: 0}
          pistol:
            type: object
            additionalProperties: false
            required: [damage, range_m, reload_seconds]
            properties:
              damage: {type: number, minimum: 0}
              range_m: {type: number, minimum: 0}
              reload_seconds: {type: number, minimum: 0}
      trait_abilities:
        type: object
        additionalProperties: false
        required: [defensive, aggressive, steadfast, adroit, engineer, popular]
        description: "One ability per trait. A played general has the ability of the FIRST trait in his `traits`."
        properties:
          defensive: {$ref: "#/definitions/hero_ability"}
          aggressive: {$ref: "#/definitions/hero_ability"}
          steadfast: {$ref: "#/definitions/hero_ability"}
          adroit: {$ref: "#/definitions/hero_ability"}
          engineer: {$ref: "#/definitions/hero_ability"}
          popular: {$ref: "#/definitions/hero_ability"}
  persons:
    type: array
    minItems: 1
    items: {$ref: "#/definitions/person"}
definitions:
  ymd:
    type: object
    additionalProperties: false
    required: [y, m, d]
    properties:
      y: {type: integer}
      m: {type: integer, minimum: 1, maximum: 12}
      d: {type: integer, minimum: 1, maximum: 31}
  ability:
    type: object
    additionalProperties: false
    required: [label, where, text]
    properties:
      label: {type: string}
      where: {enum: [pre_battle, map_army, map_town]}
      text: {type: string}
      morale: {type: integer}
      muster_at_once: {type: boolean}
      days: {type: integer, minimum: 1}
      fortification: {type: integer}
      local_support: {type: integer}
  trait:
    type: object
    additionalProperties: false
    required: [label, text, effects]
    properties:
      label: {type: string}
      text: {type: string}
      effects:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [when, label, value]
          properties:
            when: {enum: [always, attacking, defending, defending_own_ground]}
            label: {enum: [morale, readiness, reinforcement, fortification]}
            value: {type: integer}
  hero_ability:
    type: object
    additionalProperties: false
    required: [label, text, kind, radius_m, seconds, value, cooldown_seconds]
    properties:
      label: {type: string, minLength: 1}
      text: {type: string, minLength: 1}
      kind:
        enum: [hold_fast, charge, steady, quick_step, throw_up_works, huzza]
        description: >-
          CLOSED set; what `value` means is the kind's.
          hold_fast: for `seconds`, morale pressure on friendly squads within radius_m is multiplied by value.
          charge: friendly squads within radius_m are ordered to charge, and for `seconds` the shock of
          their charge is multiplied by value.
          steady: at once, friendly squads within radius_m lose value of their morale pressure (0..1)
          and their suppression.
          quick_step: for `seconds`, friendly soldiers within radius_m move at value times their speed.
          throw_up_works: a breastwork of value sections is raised where he stands (radius_m is its
          length in metres; seconds is not used).
          huzza: at once, every withdrawing or routing friendly squad within radius_m rallies, and for
          `seconds` his side's reinforcements come value times faster.
      radius_m: {type: number, minimum: 0}
      seconds: {type: number, minimum: 0}
      value: {type: number}
      cooldown_seconds: {type: number, minimum: 0}
  person:
    type: object
    additionalProperties: false
    required: [id, name, side, roles, note, basis]
    properties:
      id: {type: string, pattern: "^[a-z_]+$"}
      name: {type: string}
      rank: {type: string}
      side: {enum: [british, continental]}
      roles:
        type: array
        minItems: 1
        items: {enum: [general, delegate, organizer, envoy, agent]}
      available_from: {$ref: "#/definitions/ymd"}
      requires_measure: {type: string, description: "He is at hand only once this measure (measures data id) has made him so."}
      traits:
        type: array
        items: {enum: [defensive, aggressive, steadfast, adroit, engineer, popular]}
        description: "A general has exactly two. Every assignment is invented."
      ability: {enum: [alarm, scout, engineer, boats, pen]}
      uses: {type: integer, minimum: 1}
      starts_as:
        type: object
        additionalProperties: false
        required: [role]
        properties:
          role: {enum: [general, delegate, organizer, envoy]}
          army_id: {type: string}
      commander_in_chief: {type: boolean}
      hero:
        type: object
        additionalProperties: false
        required: [basis]
        description: "A general's own hero kit numbers, in place of hero.kit's. Invented, like the rest."
        properties:
          basis: {enum: [invented]}
          health_scale: {type: number, minimum: 1}
          aura_radius_m: {type: number, minimum: 0}
          rally_radius_m: {type: number, minimum: 0}
      informer:
        type: object
        additionalProperties: false
        required: [for]
        description: "While he holds any role the other side knows the true strength of his side's armies; on the exposed date he is found out and removed."
        properties:
          for: {enum: [british, continental]}
          exposed: {$ref: "#/definitions/ymd"}
      note: {type: string, minLength: 1}
      basis: {enum: [documented, invented]}
